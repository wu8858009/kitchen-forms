<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b17">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>備料交接日誌</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=6">
<script>(function(){var m=(location.pathname.match(/\/(fridge|prep|dish|meal|sop|equip|energy)\//)||[])[1]||"";var d=document.documentElement;d.classList.add("kf-dark","kf-"+m);if(m==="equip"||m==="fridge"||m==="dish"){d.dataset.theme="dark";new MutationObserver(function(){if(d.dataset.theme!=="dark")d.dataset.theme="dark";}).observe(d,{attributes:true,attributeFilter:["data-theme"]});}if(m==="energy"){var e=function(){var b=document.body;if(!b)return;b.classList.add("dark-mode");new MutationObserver(function(){if(!b.classList.contains("dark-mode"))b.classList.add("dark-mode");}).observe(b,{attributes:true,attributeFilter:["class"]});};if(document.body)e();else document.addEventListener("DOMContentLoaded",e);}})();</script>
<link rel="stylesheet" href="../kitchen-theme.css?v=4">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">📋</span><span id="shop">備料交接日誌</span></div>
  <nav id="nav">
    <a href="#/day" data-v="day" title="Alt+1"><b>📝</b><span>今日備料</span></a>
    <a href="#/sheet" data-v="sheet" title="Alt+2"><b>🖨️</b><span>交接表列印</span></a>
    <a href="#/items" data-v="items" title="Alt+3"><b>🧾</b><span>品項設定</span></a>
    <a href="#/settings" data-v="settings" title="Alt+4"><b>⚙️</b><span>設定</span></a>
  </nav>
  <span id="status" class="status"></span>
</header>
<main id="app"><p class="empty">載入中…</p></main>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=14"></script>
<script src="../auth.js?v=9"></script>
<script src="../kitchen-nav.js?v=14"></script>
</body>
</html>
